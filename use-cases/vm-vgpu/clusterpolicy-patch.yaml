apiVersion: nvidia.com/v1
kind: ClusterPolicy
metadata:
  name: gpu-cluster-policy
spec:
  sandboxWorkloads:
    enabled: true
    defaultWorkload: container
  sandboxDevicePlugin:
    enabled: true
  vfioManager:
    enabled: true
  vgpuManager:
    enabled: true
    repository: image-registry.openshift-image-registry.svc:5000/nvidia-gpu-operator
    image: vgpu-manager
    version: "580.82.07"
    imagePullSecrets:
      - name: private-registry-secret
  vgpuDeviceManager:
    enabled: true
    config:
      name: custom-vgpu-config
