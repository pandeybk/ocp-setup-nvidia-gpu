apiVersion: batch/v1
kind: Job
metadata:
  name: cuda-vectoradd
  namespace: gpu-test
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: vectoradd
          image: nvcr.io/nvidia/k8s/cuda-sample:vectoradd-cuda12.5.0-ubi9
          resources:
            limits:
              nvidia.com/gpu: "1"
